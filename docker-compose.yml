services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  voice-ai-backend:
    build: .
    container_name: voice-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - .:/app
    depends_on:
      - ollama
    restart: unless-stopped

  asterisk:
    build: ./asterisk
    container_name: asterisk
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10100:10000-10100/udp"
    environment:
      VOICE_API_URL: http://voice-ai-backend:8000/voice
      VOICE_MAX_TURNS: "5"
    volumes:
      - ./asterisk/config:/etc/asterisk:ro
      - ./asterisk/scripts/send_to_voice_api.py:/usr/local/bin/send_to_voice_api.py:ro
    depends_on:
      - voice-ai-backend
    restart: unless-stopped

volumes:
  ollama_data:
