services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  voice-ai-backend:
    build: .
    container_name: voice-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - .:/app
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
