[global]
type=global
user_agent=local-voice-ai-assistant
external_media_address=127.0.0.1
external_signaling_address=127.0.0.1
local_net=127.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
external_media_address=127.0.0.1
external_signaling_address=127.0.0.1

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0
external_media_address=127.0.0.1
external_signaling_address=127.0.0.1

; AI assistant extension
[1001]
type=aor
max_contacts=5
remove_existing=yes

[1001]
type=auth
auth_type=userpass
password=1001pass
username=1001

[1001]
type=endpoint
context=from-internal
disallow=all
allow=gsm
allow=ulaw
allow=alaw
auth=1001
aors=1001
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
media_use_received_transport=yes

; Optional operator test extension
[1002]
type=aor
max_contacts=5
remove_existing=yes

[1002]
type=auth
auth_type=userpass
password=1002pass
username=1002

[1002]
