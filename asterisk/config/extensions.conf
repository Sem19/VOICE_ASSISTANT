[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[from-internal]
; AI assistant: record caller speech, send to FastAPI /voice, play response
exten => 1001,1,NoOp(AI Voice Assistant)
 same => n,Set(INPUT_FILE=/tmp/in_${UNIQUEID}.wav)
 same => n,Set(OUTPUT_FILE=/tmp/out_${UNIQUEID}.gsm)
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Wait(1)
 same => n,Record(${INPUT_FILE},3,20,kq)
 same => n,System(python3 /usr/local/bin/send_to_voice_api.py ${INPUT_FILE} ${OUTPUT_FILE})
 same => n,GotoIf($["${SYSTEMSTATUS}" = "SUCCESS"]?play:fail)
 same => n(fail),Playback(ss-noservice)
 same => n,Hangup()
 same => n(play),Playback(/tmp/out_${UNIQUEID})
 same => n,Hangup()

; Simple test extension
exten => 1002,1,NoOp(Operator Test Extension)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()
