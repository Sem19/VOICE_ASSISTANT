[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[from-internal]
; AI assistant: multi-turn record-process-playback loop
exten => 1001,1,NoOp(AI Voice Assistant - Multi-turn)
 same => n,Set(CALL_ID=${UNIQUEID})
 same => n,Set(SESSION_ID=${UNIQUEID})
 same => n,Set(TURN=0)
 same => n,Set(MAX_TURNS=5)
 same => n,Answer()
 same => n,Playback(custom/ai-greeting)
 same => n(loop),Set(TURN=$[${TURN} + 1])
 same => n,GotoIf($[${TURN} > ${MAX_TURNS}]?maxturns)
 same => n,Set(INPUT_FILE=/tmp/in_${CALL_ID}_${TURN}.wav)
 same => n,Set(OUTPUT_FILE=/tmp/out_${CALL_ID}_${TURN}.gsm)
 same => n,Set(WAIT_COUNT=0)
 same => n,Set(MAX_WAIT=90)
 same => n,Playback(custom/beep)
 same => n,Record(${INPUT_FILE},2,30,kq)
 same => n,System(rm -f ${OUTPUT_FILE} /tmp/voice_${CALL_ID}.error)
 same => n,System(sh -c 'python3 /usr/local/bin/send_to_voice_api.py ${INPUT_FILE} ${OUTPUT_FILE} ${SESSION_ID} ${CALL_ID} ${TURN} >>/tmp/voice_${CALL_ID}.log 2>&1 &')
 same => n,Playback(custom/thinking)
 same => n(waitloop),Set(WAIT_COUNT=$[${WAIT_COUNT} + 1])
 same => n,GotoIf($[${WAIT_COUNT} > ${MAX_WAIT}]?fail)
 same => n,GotoIf($[${STAT(e,/tmp/voice_${CALL_ID}.error)}]?fail)
 same => n,GotoIf($[${STAT(e,/tmp/out_${CALL_ID}_${TURN}.gsm)}]?play)
 same => n,Playback(custom/thinking)
 same => n,Wait(1)
 same => n,Goto(waitloop)
 same => n(play),Playback(/tmp/out_${CALL_ID}_${TURN})
 same => n,GotoIf($[${STAT(e,/tmp/voice_${CALL_ID}.hangup)}]?done)
 same => n,Goto(loop)
 same => n(maxturns),Playback(vm-goodbye)
 same => n,Hangup()
 same => n(fail),Playback(vm-goodbye)
 same => n,Hangup()
 same => n(done),Hangup()

; Simple test extension
exten => 1002,1,NoOp(Operator Test Extension)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()
